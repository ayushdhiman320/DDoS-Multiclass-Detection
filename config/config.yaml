dataset:
  folder_1: "/home/richa.kumari/ayushminor/dataset/CSV-01-12/01-12"
  folder_2: "/home/richa.kumari/ayushminor/dataset/CSV-03-11/03-11"
  file_pattern: "*.csv"
  output_dir: "data/processed"
  final_dataset: "final_multiclass_data.csv"

labels:
  allowed_classes:
    - LDAP
    - NetBIOS
    - MSSQL
    - UDP
    - UDPLag
    - SSDP
    - DNS
    - NTP
    - Syn
    - TFTP
    - Portmap
    - SNMP
  mapping:
    LDAP: LDAP
    NetBIOS: NetBIOS
    MSSQL: MSSQL
    UDP: UDP
    UDPLag: UDPLag
    SSDP: SSDP
    DNS: DNS
    NTP: NTP
    Syn: Syn
    TFTP: TFTP
    Portmap: Portmap
    SNMP: SNMP

preprocessing:
  random_state: 42
  max_samples_per_class: 50000
  correlation_threshold: 0.98
  train_ratio: 0.60
  val_ratio: 0.20
  test_ratio: 0.20
  label_column_candidates: ["Label", "label", "Class", "class", "Attack", "attack"]
  drop_columns: ["Flow ID", "Source IP", "Destination IP", "Timestamp", "SimillarHTTP", "Inbound"]

models:
  output_dir: "models"
  metrics_dir: "reports"
  weak_classes: ["UDP", "LDAP", "SSDP"]
  use_smote: true
  use_class_weights: true
  use_focal_weights: true
  focal_gamma: 2.0
  cv_folds: 5
  optuna_trials: 100
  random_state: 42

  random_forest:
    n_estimators: 400
    max_depth: 24
    min_samples_split: 4
    n_jobs: -1

  xgboost:
    n_estimators: 500
    max_depth: 8
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.85
    tree_method: "hist"

  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 63
    subsample: 0.85
    colsample_bytree: 0.85

  catboost:
    iterations: 500
    learning_rate: 0.05
    depth: 8
    loss_function: "MultiClass"

  ensemble:
    use_stacking: true
    meta_learner: "xgboost"

inference:
  default_threshold: 0.55
  stage1_model_path: "models/stage1_binary_classifier.joblib"
  multiclass_model_path: "models/stacking_model.joblib"
  model_registry_path: "models/registry.json"
  alerts_output: "reports/alerts.log"

hpc:
  queue: "gpu"
  python_module: "python/3.9.6"
  ncpus: 5
  ngpus_training: 1
  ngpus_inference: 1
  ngpus_data_pipeline: 1
  ngpus_evaluation: 0
  walltime: "24:00:00"
